# Builds the shared core and every frontend the runner's platform supports,
# then runs the test suite -- including the real boot tests, since the
# public-domain system ROMs are bundled in the repository.
#
# The jobs deliberately do nothing to prepare the tree beyond checking it
# out: the build fetches its pinned dependencies (adamcore, the FujiNet
# firmware) and builds the FujiNet runtime itself, so CI exercises exactly
# what someone cloning the repository gets.
#
# The macOS job is the substitute for owning a Mac: it proves the core,
# the compat shims, and the AppKit frontend build and pass tests on real
# Apple hardware, and uploads a ready-to-run app bundle. The flatpak job
# proves the "no preparation at all" path end to end, since everything the
# sandbox build needs has to be declared in the manifest.

name: CI

# Tags starting with v build the same way and then publish: the artifacts
# each job already produces become the release assets (see the release job
# at the bottom, and "Cutting a release" in the README).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # An Arch container, not ubuntu-24.04: the frontends need Qt >= 6.7
    # (QRhiWidget, the GPU display) and GTK >= 4.16, and 24.04 ships Qt 6.4
    # and GTK 4.14. A frontend whose toolkit is too old is skipped by CMake,
    # so on the old image this job would go green having built nothing. The
    # packages are built on ubuntu-26.04 (linux-packages below).
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container: archlinux:latest
    steps:
      - name: Install toolkit dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja python pkgconf git \
            gtk4 libadwaita webkitgtk-6.0 qt6-base qt6-shadertools \
            qt6-webengine openssl expat zlib krb5 gnutls \
            python-yaml python-jinja desktop-file-utils
      # SDL 3.4 aborts its configure when an X11 extension it enables by
      # default has no headers (3.2 quietly disabled them), so name the whole
      # set rather than depend on what the image happens to ship:
      # Xcursor, Xdbe/Xsync/Xshape (libxext), Xinput2, Xfixes, Xrandr,
      # XScrnSaver, XTest.
      - name: Install SDL3 build dependencies
        run: |
          pacman -S --noconfirm --needed libx11 libxext libxcursor libxi \
            libxfixes libxrandr libxss libxtst libxkbcommon wayland \
            wayland-protocols libdecor alsa-lib libpulse systemd-libs \
            dbus libdrm mesa
      - uses: actions/checkout@v5
      - name: Build and install SDL3
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF
          cmake --build sdl3-src/build
          cmake --install sdl3-src/build
      # No dependency preparation: this is the plain user path. The build
      # fetches adamcore + the FujiNet firmware and builds libfujinet.so.
      # (Ubuntu's mbedTLS is 2.x, so the FujiNet build compiles the pinned
      # 3.6.5 for itself.)
      - name: Configure
        run: cmake -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify the FujiNet runtime was built and exports its entry points
        run: |
          LIB=tools/fujinet/work/out/libfujinet.so
          test -f "$LIB" || { echo "::error::$LIB missing"; exit 1; }
          nm -D --defined-only "$LIB" | grep -q fujinet_desktop_start_runtime \
            || { echo "::error::entry points not exported"; exit 1; }

  # The Linux distributable alongside the flatpak: one CPack package per
  # frontend (GNOME/KDE pull different runtime library stacks, so a user
  # who wants one should not be made to depend on the other), matching
  # fujinet-go-coco-desktop's own linux-packages job.
  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        frontend: [gnome, kde]
    # ubuntu-26.04, not 24.04: the frontends need Qt >= 6.7 and GTK >= 4.16
    # (26.04 has Qt 6.10 and GTK 4.22; 24.04 has 6.4 and 4.14, and CMake
    # would refuse the frontend named below). The .deb/.rpm therefore need a
    # distro at least that new.
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:26.04
      options: --add-host=host.docker.internal:host-gateway
    steps:
      - name: Install toolkit dependencies
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git curl \
            ca-certificates python3 pkg-config ninja-build libgtk-4-dev libadwaita-1-dev \
            libwebkitgtk-6.0-dev qt6-base-dev qt6-base-private-dev \
            qt6-shadertools-dev qt6-webengine-dev \
            libssl-dev libexpat1-dev zlib1g-dev libkrb5-dev libgnutls28-dev \
            python3-venv python3-yaml python3-jinja2 desktop-file-utils \
            dpkg-dev rpm file
      - uses: actions/checkout@v5
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install SDL3 build dependencies
        run: |
          apt-get install -y libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev
      - name: Build and install SDL3
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF
          cmake --build sdl3-src/build
          cmake --install sdl3-src/build
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr -DFRONTEND=${{ matrix.frontend }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package (deb, rpm, tar.gz)
        working-directory: build
        run: cpack -G "DEB;RPM;TGZ"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages-${{ matrix.frontend }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: error

  # One UNIVERSAL (arm64 + x86_64) bundle on the org's self-hosted Tahoe runner
  # (an Intel VM, no Homebrew): CMAKE_OSX_ARCHITECTURES in the environment
  # reaches every nested cmake run (SDL3, mbedTLS, the FujiNet runtime), and
  # OpenSSL, which FujiNet's libssh links statically, is built for both
  # architectures and lipo'd. The arm64 slice is built and checked but cannot
  # run here; the tests exercise the x86_64 slice.
  macos:
    runs-on: [self-hosted, macOS, X64, tahoe]
    env:
      CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
      # Apple clang 26 rejects libssh's -fstack-clash-protection, and the
      # FujiNet firmware builds with -Werror.
      CFLAGS: -Wno-error=unused-command-line-argument
      CXXFLAGS: -Wno-error=unused-command-line-argument
    steps:
      - uses: actions/checkout@v5
      # No Homebrew: cmake and ninja come from PyPI wheels, cmake held below 4
      # because the vendored FujiNet subprojects (libssh, libsmb2, libnfs,
      # mbedTLS) declare pre-3.5 minimums that cmake 4 rejects.
      - name: Install build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "cmake>=3.28,<4" ninja pyyaml jinja2
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Select the macOS SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache universal OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openssl-universal
          key: openssl-universal-3.5.0-${{ runner.os }}
      - name: Build universal static OpenSSL (3.5.0, pinned commit)
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          COMMIT=636dfadc70ce26f2473870570bfd9ec352806b1d # openssl-3.5.0
          SRC="$RUNNER_TEMP/openssl-src"
          rm -rf "$SRC" && git init -q "$SRC"
          git -C "$SRC" fetch -q --depth 1 https://github.com/openssl/openssl.git "$COMMIT"
          git -C "$SRC" checkout -q FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$COMMIT"
          DEST="$RUNNER_TEMP/openssl-universal"
          for arch in arm64 x86_64; do
            rm -rf "$RUNNER_TEMP/openssl-$arch"
            cp -R "$SRC" "$RUNNER_TEMP/openssl-$arch"
            (cd "$RUNNER_TEMP/openssl-$arch" &&
             ./Configure darwin64-$arch-cc no-shared no-tests \
               --prefix="$RUNNER_TEMP/openssl-$arch-inst" --libdir=lib &&
             make -j"$(sysctl -n hw.ncpu)" build_libs &&
             make install_dev)
          done
          mkdir -p "$DEST/lib"
          cp -R "$RUNNER_TEMP/openssl-x86_64-inst/include" "$DEST/include"
          for lib in libcrypto.a libssl.a; do
            lipo -create "$RUNNER_TEMP/openssl-arm64-inst/lib/$lib" \
                         "$RUNNER_TEMP/openssl-x86_64-inst/lib/$lib" \
                 -output "$DEST/lib/$lib"
          done
      - name: Point the FujiNet build at the universal OpenSSL
        run: echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl-universal" >> "$GITHUB_ENV"
      # SDL3 is linked STATICALLY on macOS so the shipped .app has no
      # non-system library dependencies. Installed under RUNNER_TEMP: the
      # runner has no passwordless sudo.
      - name: Build and install static SDL3
        run: |
          rm -rf sdl3-src
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build sdl3-src/build
          cmake --install sdl3-src/build
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/sdl3" >> "$GITHUB_ENV"
      # No dependency preparation: configure fetches adamcore and the
      # FujiNet firmware, and the build compiles libfujinet.dylib (with its
      # own pinned mbedTLS) and packs it into the app bundle.
      - name: Configure
        run: cmake -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify the bundle is self-contained and universal
        run: |
          APP="build/frontends/macos/FujiNet Go Adam.app"
          fail=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              echo "--- $f"
              otool -L "$f"
              archs="$(lipo -archs "$f")"
              case "$archs" in
                *x86_64*arm64*|*arm64*x86_64*) ;;
                *) echo "::error::$f is not universal ($archs)"; fail=1 ;;
              esac
              if otool -L "$f" | tail -n +2 | grep -E "/opt/homebrew|/usr/local"; then
                fail=1
              fi
            fi
          done < <(find "$APP" -type f -print0)
          if [ "$fail" -ne 0 ]; then
            echo "::error::bundle is not universal or links a non-system library"
            exit 1
          fi
          test -f "$APP/Contents/Frameworks/libfujinet.dylib" \
            || { echo "::error::libfujinet.dylib missing from the bundle"; exit 1; }
      # Signing and notarisation, when the credentials are configured (see
      # "Signing the macOS build" in the README). Without them the step is a
      # no-op and the build still produces a working, unsigned bundle -- so
      # pull requests and forks, which never receive secrets, stay green.
      - name: Sign and notarise the app bundle
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          APP="build/frontends/macos/FujiNet Go Adam.app"
          if [ -z "${CERT_P12}" ]; then
            echo "No signing certificate configured -- shipping unsigned."
            exit 0
          fi

          # A throwaway keychain: the runner is disposable, but this keeps
          # the certificate out of the login keychain and lets the private
          # key be used non-interactively.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')
          rm -f "$RUNNER_TEMP/cert.p12"

          # Inside out: the FujiNet library first, then the bundle around it.
          # --options runtime (the hardened runtime) is required for
          # notarisation, and it only allows the app to dlopen a library
          # signed by the same team -- which is why both are signed here
          # with the same identity rather than leaving the dylib ad-hoc.
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" "$APP/Contents/Frameworks/libfujinet.dylib"
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # Signing runs on every build (it is quick, and proves the
          # certificate still works); notarisation is a round trip to
          # Apple's service, so it is kept for the builds that ship.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Signed. Notarisation runs for tag builds."
            exit 0
          fi

          if [ -z "${NOTARY_KEY}" ]; then
            echo "::warning::Signed, but no notary credentials -- Gatekeeper"
            echo "::warning::will still block this build on first launch."
            exit 0
          fi

          # Notarisation takes the zip; the ticket is then stapled to the
          # .app so it validates offline, and the release zip is made from
          # the stapled bundle in the next step.
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm -f "$RUNNER_TEMP/notary.p8"

      # ditto preserves the executable bits and structure that a plain
      # artifact upload of a .app directory does not.
      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            "build/frontends/macos/FujiNet Go Adam.app" \
            FujiNet-Go-Adam-macos-universal.zip
      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: FujiNet-Go-Adam-macos-universal
          path: FujiNet-Go-Adam-macos-universal.zip

  # Cross-built with MinGW-w64 in an ubuntu:24.04 container on the org's
  # self-hosted runners and tested under Wine (there is no Windows runner).
  # .github/workflows/mingw-deps.sh builds the pinned static dependencies
  # (zlib, expat, MbedTLS, OpenSSL and SDL3) and writes the toolchain file.
  windows:
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    env:
      WINEPREFIX: /tmp/wine
      WINEDEBUG: -all
    steps:
      - name: Install build tools, MinGW-w64, Wine and NSIS
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates \
            build-essential make python3 python3-pip python3-venv python3-jinja2 \
            python3-yaml cmake ninja-build pkg-config mingw-w64 wine wine64 \
            xz-utils bzip2 perl nsis
      - uses: actions/checkout@v5
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache MinGW dependencies
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mingw
          key: mingw-deps-${{ hashFiles('.github/workflows/mingw-deps.sh') }}
      - name: Build MinGW dependencies
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: .github/workflows/mingw-deps.sh "$RUNNER_TEMP/mingw"
      # Builds the frontend *and* fujinet.dll. The runtime's own build takes
      # its toolchain from FUJINET_CMAKE_ARGS (word-split: no spaces inside a
      # value); GCC rejects two things clang let through.
      - name: Configure
        run: |
          P="$RUNNER_TEMP/mingw"
          echo "MBEDTLS_ROOT_DIR=$P" >> "$GITHUB_ENV"
          echo "FUJINET_CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$P/toolchain.cmake -DCMAKE_PREFIX_PATH=$P -DCMAKE_CROSSCOMPILING_EMULATOR=wine -DCMAKE_C_FLAGS=-Wno-error=stringop-truncation -DCMAKE_CXX_FLAGS=-Wno-error=conversion-null" >> "$GITHUB_ENV"
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$P/toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$P" \
            -DCMAKE_CROSSCOMPILING_EMULATOR=wine
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify the FujiNet DLL was built and exports its entry points
        run: |
          DLL=tools/fujinet/work/out/fujinet.dll
          test -f "$DLL" || { echo "::error::$DLL missing"; exit 1; }
          x86_64-w64-mingw32-objdump -p "$DLL" | grep -q fujinet_desktop_start_runtime \
            || { echo "::error::entry points not exported"; exit 1; }
      # Both binaries in the artifact must depend only on system DLLs
      # (kernel32, user32, ws2_32, ...); anything else is absent on a clean
      # Windows box. Checked by import table: fujinet.dll once shipped importing
      # libcrypto-3-x64.dll and zlib1.dll, the exe launched, LoadLibrary failed,
      # and the ADAM quietly fell through to SmartWriter with no FujiNet.
      - name: Verify the shipped binaries are self-contained
        run: |
          fail=0
          EXE=build/frontends/windows/fujinet-go-adam-windows.exe
          DLL=tools/fujinet/work/out/fujinet.dll
          for f in "$EXE" "$DLL"; do
            test -f "$f" || { echo "::error::$f not built"; exit 1; }
            echo "--- $f imports ---"
            imports=$(x86_64-w64-mingw32-objdump -p "$f" | sed -n 's/^\s*DLL Name: //p' | sort -u)
            echo "$imports"
            bad=$(echo "$imports" | grep -ivE \
              '^(api-ms-win-[a-z0-9el-]+|kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|comctl32|comdlg32|imm32|winmm|version|setupapi|dwmapi|ws2_32|iphlpapi|bcrypt|crypt32|secur32|netapi32|userenv|dbghelp|shlwapi|msvcrt|ucrtbase|rpcrt4|winspool|uxtheme|hid|cfgmgr32|powrprof|avrt|dxgi|d3d11|opengl32)\.dll$' \
              || true)
            if [ -n "$bad" ]; then
              echo "::error::$f imports non-system DLLs that are not shipped:"
              echo "$bad"
              fail=1
            fi
          done
          exit $fail
      # The artifact is the folder you copy and run: the exe, fujinet.dll
      # beside it (where the session looks first), and the pristine FujiNet
      # runtime tree it provisions from on first start.
      - name: Stage the app folder
        run: |
          mkdir -p dist/FujiNet-Go-Adam/fujinet
          cp build/frontends/windows/fujinet-go-adam-windows.exe \
             dist/FujiNet-Go-Adam/
          cp tools/fujinet/work/out/fujinet.dll dist/FujiNet-Go-Adam/
          cp tools/fujinet/work/out/fnconfig.ini dist/FujiNet-Go-Adam/fujinet/
          cp -r tools/fujinet/work/out/data tools/fujinet/work/out/SD \
             dist/FujiNet-Go-Adam/fujinet/
      - name: Upload app folder
        uses: actions/upload-artifact@v5
        with:
          name: FujiNet-Go-Adam-windows
          path: dist/FujiNet-Go-Adam
      # The installer packages the folder staged above, so the two Windows
      # downloads are the same bits: one for people who want Start Menu entry
      # and an uninstaller, one for portable use.
      - name: Build the installer
        run: |
          version=$(sed -n 's/^project(.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          makensis -V2 \
            -DVERSION="$version" \
            -DSRCDIR="$PWD/dist/FujiNet-Go-Adam" \
            -DOUTFILE="$PWD/dist/FujiNet-Go-Adam-Setup.exe" \
            -DAPPICON="$PWD/frontends/windows/app.ico" \
            build-aux/windows/installer.nsi
          test -f dist/FujiNet-Go-Adam-Setup.exe \
            || { echo "::error::installer not produced"; exit 1; }
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: FujiNet-Go-Adam-windows-installer
          path: dist/FujiNet-Go-Adam-Setup.exe

  # The flatpak is the distributable Linux build, and the strictest test of
  # the "clone and build" promise: the sandbox has no network during the
  # build, so anything the manifest does not declare is simply absent.
  flatpak:
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --privileged --add-host=host.docker.internal:host-gateway
    # --privileged: flatpak-builder's bubblewrap sandbox needs user namespaces.
    strategy:
      # Both frontends ship a flatpak; let one finish even if the other
      # breaks, so a runtime bump on one side does not mask the other.
      fail-fast: false
      matrix:
        include:
          - frontend: gnome
            app-id: online.fujinet.go.adam.gnome
            runtime: org.gnome.Platform//51 org.gnome.Sdk//51
            bundle: FujiNet-Go-Adam-gnome.flatpak
          - frontend: kde
            app-id: online.fujinet.go.adam.kde
            runtime: org.kde.Platform//6.11 org.kde.Sdk//6.11
            bundle: FujiNet-Go-Adam-kde.flatpak
    steps:
      # Driven directly rather than through the usual community container
      # image: its tags stop at gnome-47, and these manifests target GNOME 51
      # and KDE 6.11.
      - name: Install flatpak and the ${{ matrix.frontend }} runtime
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl flatpak flatpak-builder elfutils unzip
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub ${{ matrix.runtime }}
      - uses: actions/checkout@v5
      # --disable-rofiles-fuse: FUSE is not available to the runner user.
      - name: Build the flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo build-flatpak \
            build-aux/flatpak/${{ matrix.app-id }}.yml
      - name: Bundle
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo flatpak-repo ${{ matrix.bundle }} \
            ${{ matrix.app-id }} master
      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: FujiNet-Go-Adam-flatpak-${{ matrix.frontend }}
          path: ${{ matrix.bundle }}

  # Publishing. Runs only for v* tags, and only once every platform has
  # built and tested: the release carries exactly the binaries CI verified.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-packages, macos, windows, flatpak]
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container:
      image: ubuntu:24.04
      options: --add-host=host.docker.internal:host-gateway
    permissions:
      contents: write
    steps:
      - name: Install base tools
        shell: bash
        run: |
          MIRROR=http://mirrors.edge.kernel.org/ubuntu
          (echo > /dev/tcp/host.docker.internal/3142) 2>/dev/null \
            && MIRROR=http://host.docker.internal:3142/mirrors.edge.kernel.org/ubuntu
          sed -i "s|http://[a-z.]*ubuntu.com/ubuntu|$MIRROR|" /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates gh zip
      - uses: actions/checkout@v5
      # The version lives in CMakeLists.txt and the AppStream metainfo (which
      # is where release notes belong). A tag that disagrees with them would
      # ship packages whose About box contradicts the download, so stop here
      # instead -- delete the tag, fix the version, tag again.
      - name: Check the tag matches the declared version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          project=$(sed -n 's/^project(.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag but CMakeLists.txt says $project"
            exit 1
          fi
          for m in frontends/*/data/*.metainfo.xml; do
            if ! grep -q "<release version=\"$tag\"" "$m"; then
              echo "::error::$m has no <release version=\"$tag\"> entry"
              exit 1
            fi
          done
          echo "version $tag agrees across CMakeLists.txt and the metainfo"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      # download-artifact unpacks each artifact into its own directory, so
      # the folder-shaped Windows one is re-zipped for the release page.
      - name: Assemble release assets
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' \
                                    -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          cp "artifacts/FujiNet-Go-Adam-macos-universal/FujiNet-Go-Adam-macos-universal.zip" \
             "release/FujiNet-Go-Adam-${tag}-macos-universal.zip"
          cp "artifacts/FujiNet-Go-Adam-flatpak-gnome/FujiNet-Go-Adam-gnome.flatpak" \
             "release/FujiNet-Go-Adam-${tag}-gnome.flatpak"
          cp "artifacts/FujiNet-Go-Adam-flatpak-kde/FujiNet-Go-Adam-kde.flatpak" \
             "release/FujiNet-Go-Adam-${tag}-kde.flatpak"
          (cd artifacts/FujiNet-Go-Adam-windows \
           && zip -qr "../../release/FujiNet-Go-Adam-${tag}-windows.zip" .)
          cp "artifacts/FujiNet-Go-Adam-windows-installer/FujiNet-Go-Adam-Setup.exe" \
             "release/FujiNet-Go-Adam-${tag}-windows-setup.exe"
          ls -l release
      # Creates the release when the tag was pushed on its own (as a draft,
      # so the notes can be written before it goes out); when the release
      # already exists -- made in the web UI -- it is left alone and only
      # the assets are attached.
      - name: Publish the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --generate-notes \
              --title "FujiNet Go Adam $tag"
          fi
          gh release upload "$tag" release/* --clobber
