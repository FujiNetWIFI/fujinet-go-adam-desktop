# Flatpak manifest for the KDE (Qt6) frontend.
#
# The GNOME manifest's twin -- same self-contained shape, so the two stay
# easy to diff: every input is declared here and a build never depends on
# the state of a working checkout. The differences are the runtime (KDE
# instead of GNOME), the frontend selected from the shared CMake tree, and
# no embedded web view (see the note below).
#
# Build + install + run:
#   flatpak-builder --user --install --force-clean build-flatpak-kde \
#       build-aux/flatpak/online.fujinet.go.adam.kde.yml
#   flatpak run online.fujinet.go.adam.kde
#
# NOTE: bump runtime-version (and the SDL tag) as new KDE runtimes ship;
# `flatpak remote-ls flathub --runtime | grep org.kde.Platform` lists what is
# available. Keep the pinned adamcore/fujinet commits in step with
# cmake/Dependencies.cmake and the GNOME manifest.

app-id: online.fujinet.go.adam.kde
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: fujinet-go-adam-kde

# No embedded web view here, deliberately. QtWebEngine is the KDE counterpart
# of the GNOME runtime's WebKitGTK, but org.kde.Sdk does not ship it -- it
# comes from io.qt.qtwebengine.BaseApp, and because a base app's files are
# copied into /app they land in the bundle too: a whole Chromium, ~200 MB of
# libQt6WebEngineCore alone, for a 70 MB download against GNOME's 4 MB.
#
# With WITH_WEBVIEW=OFF the frontend opens the FujiNet config in the user's
# browser via QDesktopServices::openUrl(), which the OpenURI portal handles
# without any extra sandbox permission. Same feature, a fraction of the size.
finish-args:
  - --share=ipc
  - --share=network          # TNFS hosts + the loopback web UI
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio      # SDL audio (PipeWire's Pulse interface)
  - --device=all             # gamepad hotplug (hidraw/evdev)

# Only the build-time leftovers of our own modules; with no QtWebEngine base
# app there is nothing large left to prune.
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /mkspecs
  - /share/gtk-doc
  - /share/man

modules:
  - name: sdl3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
      # SDL is used only for audio and gamepad here -- the window is Qt's, and
      # no frontend calls SDL_INIT_VIDEO. Switching the video subsystem off
      # drops SDL's X11 requirement, which org.kde.Sdk does not satisfy on its
      # own (the QtWebEngine base app used to drag those headers in, so this
      # surfaced the moment it was removed).
      - -DSDL_VIDEO=OFF
      # ...and SDL refuses to configure with no X11 and no Wayland unless the
      # intent is stated outright (cmake/macros.cmake guards on this).
      - -DSDL_UNIX_CONSOLE_BUILD=ON
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        # Pin the release you validated against; keep it in step with the
        # SDL the CI jobs build (.github/workflows/ci.yml).
        tag: release-3.4.12
        commit: f87239e71e42da91ca317a12eefb82cfbf3393eb

  # FujiNet links mbedTLS statically and needs 3.x (4.x drops the legacy
  # mbedtls/md5.h it includes); the runtime ships none. Threading is switched
  # on because fujinet drives TLS from several threads.
  - name: mbedtls
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_PROGRAMS=OFF
      - -DENABLE_TESTING=OFF
      - -DMBEDTLS_FATAL_WARNINGS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DUSE_STATIC_MBEDTLS_LIBRARY=ON
      - -DUSE_SHARED_MBEDTLS_LIBRARY=OFF
      - -DLINK_WITH_PTHREAD=ON
      # Left to GNUInstallDirs this lands in lib64 on some builders and lib
      # on others; the FujiNet build has to find it either way, but pinning
      # it keeps the two ends predictable.
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/Mbed-TLS/mbedtls.git
        tag: mbedtls-3.6.5
        commit: e185d7fd85499c8ce5ca2a54f5cf8fe7dbe3f8df
      - type: shell
        commands:
          - sed -i -e 's|^//#define MBEDTLS_THREADING_C|#define MBEDTLS_THREADING_C|'
            -e 's|^//#define MBEDTLS_THREADING_PTHREAD|#define MBEDTLS_THREADING_PTHREAD|'
            include/mbedtls/mbedtls_config.h

  # The FujiNet build renders its web UI from jinja2 templates driven by a
  # yaml description. Build-time only: the sdists are installed into
  # ${FLATPAK_DEST} for the SDK python, and the module cleans up after itself.
  #
  # flit_core is built first and is the one addition over the GNOME manifest:
  # Jinja2 declares it as its PEP-517 backend, and --no-build-isolation means
  # the backend has to already be importable. The GNOME SDK happens to ship
  # it; the KDE SDK does not, so without this the module dies with
  # "Cannot import 'flit_core.buildapi'".
  - name: python3-webui-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST}
        --find-links="file://${PWD}" flit_core
      - PYTHONPATH="$(echo ${FLATPAK_DEST}/lib/python3.*/site-packages):${PYTHONPATH}"
        pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST}
        --find-links="file://${PWD}" PyYAML Jinja2 MarkupSafe
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/69/59/b6fc2188dfc7ea4f936cd12b49d707f66a1cb7a1d2c16172963534db741b/flit_core-3.12.0.tar.gz
        sha256: 18f63100d6f94385c6ed57a72073443e1a71a4acb4339491615d0f16d6ff01b2
      - type: file
        url: https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
        sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
      - type: file
        url: https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
        sha256: 0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d
      - type: file
        url: https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz
        sha256: 722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698

  - name: fujinet-go-adam
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DFRONTEND=kde
      - -DWITH_WEBVIEW=OFF    # see the note above finish-args
    build-options:
      env:
        # Where the FujiNet build finds the static mbedTLS built above.
        MBEDTLS_ROOT_DIR: /app
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - build
          - build-all
          - build-flatpak
          - build-flatpak-kde
          - build-gnome
          - build-kde
          - build-win
          - third_party
          - tools/fujinet/work
      - type: git
        url: https://github.com/tschak909/adamcore
        commit: d37f05596931859d41d4e4d267531509a3d7f2f3
        dest: third_party/adamcore
      - type: git
        url: https://github.com/FujiNetWIFI/fujinet-firmware
        commit: 3e888b1c57f4cc30298169e37a69d1d44d3ccdbd
        dest: third_party/fujinet-firmware
